<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 800" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arwc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .title{font-size:24px;font-weight:700;fill:#0f172a}
      .sub{font-size:13px;fill:#64748b}
      .bt{font-size:14.5px;font-weight:700}
      .bs{font-size:11.5px;fill:#64748b}
      .bd{font-size:12px;fill:#334155}
      .mono{font-size:11.5px;font-weight:600;fill:#334155;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
      .lab{font-size:11px;fill:#475569}
      .labi{font-size:11px;fill:#64748b;font-style:italic}
      .head{font-size:12.5px;font-weight:700;fill:#475569}
      .badge{font-size:12px;font-weight:700;fill:#ffffff}
      .lg{font-size:12.5px;fill:#334155}
    </style>
  </defs>

  <rect x="0" y="0" width="980" height="800" rx="14" fill="#f6f7f9"/>

  <text x="40" y="38" class="title">How mailotp works</text>
  <text x="40" y="60" class="sub">Self-served signup OTP / confirmation links for ARTEX agents — the <tspan font-weight="700">mailotp serve</tspan> daemon model</text>

  <!-- ===================== EXTERNAL ROW ===================== -->
  <!-- Target -->
  <rect x="50" y="84" width="250" height="94" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="175" y="112" text-anchor="middle" class="bt" fill="#334155">In-scope target</text>
  <text x="175" y="134" text-anchor="middle" class="bd">signup / verification page</text>
  <text x="175" y="154" text-anchor="middle" class="bs">(an account you own)</text>

  <!-- Gmail -->
  <rect x="680" y="84" width="250" height="94" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="805" y="112" text-anchor="middle" class="bt" fill="#334155">Gmail mailboxes</text>
  <text x="805" y="134" text-anchor="middle" class="mono">test01 / test02 — IMAP :993</text>
  <text x="805" y="154" text-anchor="middle" class="bs">INBOX + Spam, read-only</text>

  <!-- 3: target emails the code -->
  <line x1="300" y1="124" x2="676" y2="124" stroke="#475569" stroke-width="1.6" marker-end="url(#arw)"/>
  <circle cx="490" cy="124" r="12" fill="#2563eb"/><text x="490" y="128" text-anchor="middle" class="badge">3</text>
  <text x="490" y="112" text-anchor="middle" class="lab">emails the OTP / link</text>

  <!-- ===================== CONTAINER ===================== -->
  <rect x="40" y="200" width="900" height="402" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="58" y="224" class="head">scopeweaver container</text>
  <text x="193" y="224" class="bs">·  start.sh supervises the mailotp serve sidecar  ·  agents never open IMAP</text>

  <!-- Agent -->
  <rect x="66" y="250" width="234" height="150" rx="10" fill="#ecfeff" stroke="#0891b2"/>
  <text x="183" y="278" text-anchor="middle" class="bt" fill="#0e7490">ARTEX agent</text>
  <text x="183" y="296" text-anchor="middle" class="bs">thin CLI — local, read-only</text>
  <line x1="86" y1="308" x2="280" y2="308" stroke="#a5f3fc"/>
  <text x="183" y="330" text-anchor="middle" class="mono">alloc · fetch --handle</text>
  <text x="183" y="352" text-anchor="middle" class="mono">query · release</text>
  <text x="183" y="374" text-anchor="middle" class="mono">mailboxes</text>

  <!-- Daemon -->
  <rect x="460" y="250" width="286" height="150" rx="10" fill="#eff6ff" stroke="#2563eb"/>
  <text x="603" y="278" text-anchor="middle" class="bt" fill="#1d4ed8">mailotp serve (daemon)</text>
  <text x="603" y="302" text-anchor="middle" class="bd">1 IMAP poller per mailbox (01, 02)</text>
  <text x="603" y="324" text-anchor="middle" class="bd">read-only pull, poll every 15s</text>
  <text x="603" y="346" text-anchor="middle" class="bd">ingest INBOX + Spam into the store</text>
  <text x="603" y="368" text-anchor="middle" class="bs">UIDVALIDITY + last-UID tracked, hourly prune</text>

  <!-- Guard (top right) -->
  <rect x="762" y="250" width="156" height="150" rx="10" fill="#fef2f2" stroke="#ef4444"/>
  <text x="840" y="276" text-anchor="middle" class="bt" fill="#b91c1c" font-size="13">Provenance guard</text>
  <text x="840" y="300" text-anchor="middle" class="bs">use a code only if:</text>
  <text x="840" y="324" text-anchor="middle" class="bd">· To = your +tag</text>
  <text x="840" y="346" text-anchor="middle" class="bd">· sender matches</text>
  <text x="840" y="364" text-anchor="middle" class="bd">  the signup</text>
  <text x="840" y="388" text-anchor="middle" class="bs">else: ignore it</text>

  <!-- socket channel: two arrows between agent and daemon -->
  <line x1="300" y1="320" x2="456" y2="320" stroke="#475569" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="460" y1="362" x2="304" y2="362" stroke="#475569" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="338" y="333" width="80" height="18" rx="9" fill="#e2e8f0"/>
  <text x="378" y="346" text-anchor="middle" class="mono" font-size="10.5">mailotp.sock</text>
  <circle cx="330" cy="320" r="11" fill="#2563eb"/><text x="330" y="324" text-anchor="middle" class="badge">1</text>
  <circle cx="430" cy="362" r="11" fill="#2563eb"/><text x="430" y="366" text-anchor="middle" class="badge">5</text>
  <text x="378" y="308" text-anchor="middle" class="labi">NDJSON over a unix socket</text>

  <!-- Store -->
  <rect x="326" y="470" width="420" height="96" rx="10" fill="#fffbeb" stroke="#d97706"/>
  <text x="536" y="498" text-anchor="middle" class="bt" fill="#b45309">SQLite store — store.db</text>
  <text x="536" y="520" text-anchor="middle" class="bd">on the <tspan class="mono">sw_data</tspan> volume — durable, survives recreate</text>
  <text x="536" y="542" text-anchor="middle" class="bs">messages · allocations · leases · sync_state</text>

  <!-- daemon <-> store -->
  <line x1="560" y1="400" x2="560" y2="466" stroke="#475569" stroke-width="1.6" marker-end="url(#arw)" marker-start="url(#arw)"/>
  <text x="648" y="438" text-anchor="middle" class="lab">write (ingest)</text>
  <text x="648" y="452" text-anchor="middle" class="lab">/ serve (read)</text>

  <!-- Secrets -->
  <rect x="66" y="470" width="234" height="96" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="183" y="498" text-anchor="middle" class="bt" fill="#475569" font-size="13">secrets.yaml (mounted ro)</text>
  <text x="183" y="520" text-anchor="middle" class="bd">daemon loads the App Password</text>
  <text x="183" y="542" text-anchor="middle" class="bs">never reaches the agent / LLM</text>

  <!-- secrets -> daemon (creds, dashed) -->
  <path d="M300,500 C370,500 420,452 470,404" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arwc)"/>
  <text x="372" y="492" text-anchor="middle" class="labi">App Password</text>

  <!-- Metrics -->
  <rect x="762" y="470" width="156" height="96" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="840" y="498" text-anchor="middle" class="bt" fill="#4338ca" font-size="13">/metrics :9469</text>
  <text x="840" y="520" text-anchor="middle" class="bd">operator plane (HTTP)</text>
  <text x="840" y="542" text-anchor="middle" class="bs">reads, agents, queue…</text>
  <!-- daemon -> metrics -->
  <line x1="746" y1="340" x2="800" y2="466" stroke="#475569" stroke-width="1.4" marker-end="url(#arw)"/>

  <!-- 2 / 6: agent <-> target -->
  <line x1="176" y1="250" x2="168" y2="180" stroke="#475569" stroke-width="1.6" marker-end="url(#arw)"/>
  <circle cx="150" cy="232" r="11" fill="#2563eb"/><text x="150" y="236" text-anchor="middle" class="badge">2</text>
  <circle cx="205" cy="232" r="11" fill="#16a34a"/><text x="205" y="236" text-anchor="middle" class="badge">6</text>
  <text x="300" y="214" text-anchor="middle" class="lab">enter +tag addr (2) · use code, release (6)</text>

  <!-- 4: gmail -> daemon -->
  <line x1="800" y1="178" x2="690" y2="250" stroke="#475569" stroke-width="1.6" marker-end="url(#arw)"/>
  <circle cx="762" cy="208" r="12" fill="#2563eb"/><text x="762" y="212" text-anchor="middle" class="badge">4</text>

  <!-- ===================== BOTTOM BAND ===================== -->
  <!-- Legend -->
  <rect x="40" y="616" width="560" height="168" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="58" y="640" class="head">Flow (one signup)</text>
  <g>
    <circle cx="68" cy="662" r="10" fill="#2563eb"/><text x="68" y="666" text-anchor="middle" class="badge">1</text>
    <text x="88" y="666" class="lg"><tspan class="mono">alloc --mailbox 01</tspan> → a unique <tspan class="mono">+tag</tspan> address + a handle</text>
    <circle cx="68" cy="686" r="10" fill="#2563eb"/><text x="68" y="690" text-anchor="middle" class="badge">2</text>
    <text x="88" y="690" class="lg">the agent enters that address in the target signup</text>
    <circle cx="68" cy="710" r="10" fill="#2563eb"/><text x="68" y="714" text-anchor="middle" class="badge">3</text>
    <text x="88" y="714" class="lg">the target emails the OTP code / confirmation link</text>
    <circle cx="68" cy="734" r="10" fill="#2563eb"/><text x="68" y="738" text-anchor="middle" class="badge">4</text>
    <text x="88" y="738" class="lg">the daemon poller syncs Gmail (read-only, 15s) into SQLite</text>
    <circle cx="68" cy="758" r="10" fill="#2563eb"/><text x="68" y="762" text-anchor="middle" class="badge">5</text>
    <text x="88" y="762" class="lg"><tspan class="mono">fetch --handle</tspan> returns only the agent's own message</text>
    <circle cx="68" cy="782" r="10" fill="#16a34a"/><text x="68" y="786" text-anchor="middle" class="badge">6</text>
    <text x="88" y="786" class="lg">the agent reads the code/link, uses it, then <tspan class="mono">release</tspan></text>
  </g>

  <!-- Observability -->
  <text x="690" y="640" class="head">Observability</text>
  <rect x="632" y="652" width="130" height="58" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="697" y="678" text-anchor="middle" class="bt" fill="#334155" font-size="13">Prometheus</text>
  <text x="697" y="697" text-anchor="middle" class="bs">scrapes :9469</text>
  <rect x="800" y="652" width="130" height="58" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="865" y="678" text-anchor="middle" class="bt" fill="#334155" font-size="13">Grafana</text>
  <text x="865" y="697" text-anchor="middle" class="bs">uid mailotp</text>
  <!-- metrics -> prometheus -> grafana -->
  <path d="M840,566 C840,610 760,620 720,652" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arwc)"/>
  <line x1="762" y1="681" x2="796" y2="681" stroke="#64748b" stroke-width="1.6" marker-end="url(#arwc)"/>

  <text x="940" y="796" text-anchor="end" class="bs">ARTEX / ScopeWeaver · email-otp</text>
</svg>
